[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "everything2lego"
version = "0.1.0"
description = "Convert images or 3D meshes into buildable LEGO models using real bricks."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
    "pillow>=10.0",
    "typer>=0.12",
    "rich>=13.7",
    "reportlab>=4.0",
    "scipy>=1.11",
    "networkx>=3.0",
    "pygltflib>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
everything2lego = "everything2lego.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
everything2lego = ["viewer/*", "data/*.json"]
