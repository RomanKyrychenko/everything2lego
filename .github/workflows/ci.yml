name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (no neural extras; torch-dependent tests skip)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest tests -q -ra

  viewer:
    name: viewer bundle + headless Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python package (the viewer test exports its fixture scene with it)
        run: python -m pip install -e .
      - name: Install Node dependencies
        run: npm ci
      - name: Rebuild viewer bundle
        run: npm run build:viewer
      - name: Verify committed bundle.js is up to date
        run: git diff --exit-code -- src/everything2lego/viewer/bundle.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run offline viewer test
        run: npm run test:viewer
